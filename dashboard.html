<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Meterr.id</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="dash-body">

<header class="dash-navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h5M14 7h5"/><path d="M5 7 2 13a3 3 0 0 0 6 0L5 7Z"/><path d="M19 7l-3 6a3 3 0 0 0 6 0l-3-6Z"/><path d="M7 21h10"/></svg></span>
      Meterr.id
    </a>
    <div class="user-chip">
      <div class="user-info">
        <div class="name" id="user-name">—</div>
        <div class="email" id="user-email">—</div>
      </div>
      <div class="avatar" id="user-avatar">U</div>
      <button id="logout-btn" class="btn btn-ghost">Keluar</button>
    </div>
  </div>
</header>

<main class="dash-main">
  <div class="container">
    <div class="dash-head">
      <div>
        <h1>Dashboard Loadcell</h1>
        <p>Data berat realtime dari sensor ESP32 + HX711.</p>
      </div>
      <div class="conn-status">
        <span class="status-indicator" id="status-dot"></span>
        <span id="status-text">Menghubungkan...</span>
      </div>
    </div>

    <div class="dash-grid">
      <div class="card">
        <p class="card-title">Berat Saat Ini</p>
        <div class="weight-display">
          <div class="weight-ring">
            <div class="reading">
              <div class="num" id="weight-value">0.00</div>
              <div class="unit">kg</div>
            </div>
          </div>
          <div class="last-update">Terakhir diperbarui: <span id="last-update">—</span></div>
        </div>
        <div class="stats-row">
          <div class="stat-box">
            <div class="label">Min</div>
            <div class="value" id="min-value">—</div>
          </div>
          <div class="stat-box">
            <div class="label">Rata-rata</div>
            <div class="value" id="avg-value">—</div>
          </div>
          <div class="stat-box">
            <div class="label">Max</div>
            <div class="value" id="max-value">—</div>
          </div>
        </div>
      </div>

      <div class="card chart-card">
        <p class="card-title">Riwayat Berat (50 data terakhir)</p>
        <div class="chart-wrap">
          <canvas id="weight-chart"></canvas>
          <p class="empty-note" id="empty-note">Menunggu data riwayat dari perangkat...</p>
        </div>
      </div>
    </div>
  </div>
</main>

<a href="aichat.html" class="chat-bubble" aria-label="Buka SatriaKlengerAI">
  <span class="chat-bubble-ripple"></span>
  <span class="chat-bubble-ripple delay"></span>
  <img src="asset/satria-icon.png" alt="SatriaKlengerAI" />
</a>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
